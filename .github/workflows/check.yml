name: check
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: python syntax
        run: python3 -m py_compile bridge_guard.py exit_probe.py exit_probe_conf.py lanes_probe.py
      - name: shell syntax
        run: bash -n scripts/*.sh
      - name: CLI help
        run: for c in "" run setup doctor status rollback; do python3 bridge_guard.py $c --help >/dev/null; done
      - name: examples are valid JSON
        run: python3 -c "import json; json.load(open('examples/config.example.json')); json.load(open('examples/exit-probe.example.json'))"
      - name: empty and unfilled configs are rejected (exit 2)
        run: |
          echo '{}' > /tmp/empty.json
          python3 bridge_guard.py --config /tmp/empty.json status; [ $? -eq 2 ] || { echo "пустой конфиг должен давать exit 2"; exit 1; }
          python3 bridge_guard.py --config examples/config.example.json status; [ $? -eq 2 ] || { echo "пример с заглушками должен давать exit 2"; exit 1; }
      - name: versions match the changelog
        run: |
          v=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-)
          for f in bridge_guard.py lanes_probe.py exit_probe.py exit_probe_conf.py; do grep -q "VERSION = \"$v\"" $f || { echo "$f: версия не $v"; exit 1; }; done
          [ "$(python3 bridge_guard.py --version)" = "$v" ]
      - name: doctor without config exits 1 with a hint
        run: |
          python3 bridge_guard.py --config /tmp/none.json doctor | grep -q "bridge-guard setup"; [ ${PIPESTATUS[0]} -eq 1 ]
